<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040816"/>
      <stop offset="50%" stop-color="#091432"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#7000ff"/>
      <stop offset="100%" stop-color="#ff0077"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="110" fill="url(#bgG)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#glowG)" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Orbital Speed Ring / Telemetry -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#00f0ff" stroke-width="8" stroke-dasharray="18 10" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#7000ff" stroke-width="4" stroke-opacity="0.5"/>

  <!-- Futuristic Spaceship / Cockpit V Logo -->
  <g filter="url(#neon)">
    <!-- Main thruster body -->
    <path d="M256 80 L350 340 L256 295 L162 340 Z" fill="url(#glowG)"/>
    <!-- Cockpit core window -->
    <polygon points="256,150 286,255 256,245 226,255" fill="#00f0ff"/>
    <!-- Plasma thruster flame -->
    <path d="M226 345 L256 425 L286 345 L256 320 Z" fill="#00f0ff" opacity="0.9"/>
  </g>

  <!-- Digital dots -->
  <circle cx="130" cy="190" r="6" fill="#00f0ff" opacity="0.8"/>
  <circle cx="382" cy="190" r="6" fill="#00f0ff" opacity="0.8"/>
  <circle cx="256" cy="450" r="8" fill="#00ff88"/>
</svg>
